<div class="container">

  <h1> Каталог фільмів</h1>

  <div class="counter">
    Всього фільмів: {{ movies.length }}
  </div>

  <div class="movies-list">

    <div
      class="movie-card"
      *ngFor="let movie of movies; let i = index"
      [ngClass]="getRatingClass(movie.rating)"
    >

      <h2>{{ movie.title }}</h2>

      <p>
        <strong>Рік:</strong> {{ movie.year }}
      </p>

      <p>
        <strong>Рейтинг:</strong> {{ movie.rating }}/10
      </p>

      <p
        class="recommended"
        *ngIf="movie.rating >= 8"
      >
         Рекомендовано
      </p>

      <button
        class="delete-button"
        (click)="deleteMovie(i)"
      >
        Видалити
      </button>

    </div>

  </div>

  <div class="form-container">

    <h2> Додати фільм</h2>

    <div class="form-group">
      <label>Назва фільму:</label>

      <input
        type="text"
        [(ngModel)]="newMovie.title"
        placeholder="Введіть назву"
      >
    </div>

    <div class="form-group">
      <label>Рік:</label>

      <input
        type="number"
        [(ngModel)]="newMovie.year"
        placeholder="Введіть рік"
      >
    </div>

    <div class="form-group">
      <label>Рейтинг:</label>

      <input
        type="number"
        min="1"
        max="10"
        [(ngModel)]="newMovie.rating"
        placeholder="Від 1 до 10"
      >
    </div>

    <button
      class="add-button"
      (click)="addMovie()"
      [disabled]="newMovie.title.trim() === ''"
    >
      Додати фільм
    </button>

    <p
      class="warning"
      *ngIf="newMovie.title.trim() === ''"
    >
      Введіть назву фільму
    </p>

  </div>

</div>
